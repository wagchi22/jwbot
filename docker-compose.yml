services:
  jwbot:
    image: ghcr.io/wagchi22/jwbot:latest
    container_name: jwbot
    hostname: jwbot
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_NO_SANDBOX: "1"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - jwbot:/app/.wwebjs_auth
      - jwbot:/app/.wwebjs_cache

volumes:
  jwbot:
    name: jwbot
