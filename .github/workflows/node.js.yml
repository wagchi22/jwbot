# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests on the latest Node.js LTS version
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
    - run: npm ci
    - name: Validate commit messages
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: npx commitlint --from="$BASE_SHA" --to="$HEAD_SHA"

  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Require semantic-release token
      env:
        SEMANTIC_RELEASE_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
      run: |
        if [ -z "$SEMANTIC_RELEASE_TOKEN" ]; then
          echo "::error::Configure the SEMANTIC_RELEASE_TOKEN repository secret before enabling release commits."
          exit 1
        fi
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
    - run: npm ci
    - name: Publish GitHub release
      run: npm run release
      env:
        GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
